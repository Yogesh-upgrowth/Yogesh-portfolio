# G02 — verify every cited source is still reachable.
#
# G02 is one of four gates that have never run for any page. It checks that each
# fact's source_url was observed returning 200, and it reads that observation
# from the fetch_log on the research object rather than re-fetching, so the log
# has to be produced somewhere with open outbound HTTP. The agent container's
# egress proxy denies arbitrary hosts, so it is produced here: a GitHub runner
# has open network, and the logs it writes are committed back so that G02 then
# runs offline for everyone, including on a laptop.
#
# Deliberately not on push. Running it on every commit would re-fetch 130
# publishers for a one-line change, and committing the logs from a push-triggered
# job would re-trigger the job. Manual dispatch covers the pre-launch check; the
# weekly run catches link rot after launch, which matters for a site whose whole
# premise is that every number is sourced.
name: source check

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:14 UTC. Off the hour because every other job runs at :00.
    - cron: "14 6 * * 1"
  # Also on a pull request, but only one that touches the sources themselves or
  # the verifier. workflow_dispatch does not exist until the workflow reaches the
  # default branch, so without this the first real G02 run would have to wait for
  # a merge. The commit step is skipped on a pull request, so this cannot
  # re-trigger itself.
  pull_request:
    paths:
      - "seo/research/**"
      - "seo/scripts/verify_sources.py"
      - ".github/workflows/source-check.yml"

permissions:
  contents: write

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pnpm
        run: npm i -g pnpm@9
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Records the real observed status. A non-200 is reported, never papered
      # over: the fact needs an archive_url or a live replacement, and G02
      # blocks its page until it has one.
      - name: Observe every source URL
        run: python3 seo/scripts/verify_sources.py | tee /tmp/sources.txt

      # The similarity gate reads a report this job would otherwise never
      # generate, so without this it skips here while passing in the checks job
      # — two jobs disagreeing about the same corpus for no real reason.
      - name: Similarity corpus check
        working-directory: web
        run: pnpm similarity

      # With fetch_logs present G02 stops skipping and actually runs. This step
      # is what proves the logs are usable, not just written.
      - name: Content gates, with G02 now running
        working-directory: web
        run: pnpm gates 2>&1 | tee /tmp/gates.txt || true

      # Counted from the gate report, not the console output. The console prints
      # one verdict line per page and never names a gate, so grepping it for
      # "G02" reported 0 blocked pages while 41 were blocked.
      - name: Report G02's verdict
        run: |
          echo "### Source check" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/sources.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          report=reports/wave-all.md
          g02=$(grep -c '^| G02 .*| BLOCK |' "$report" || true)
          pages=$(grep -c '^## ' "$report" || true)
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**G02 blocked $g02 of $pages pages.**" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reasons, by count:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '^| G02 .*| BLOCK |' "$report" \
            | sed 's/.*| BLOCK |[^|]*| //; s/ |$//' \
            | sed 's/[0-9]\+/N/g' | sort | uniq -c | sort -rn \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Not on a pull request: a commit to seo/research would match this
      # workflow's own path filter and trigger it again.
      - name: Commit the fetch logs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- seo/research; then
            echo "no change in observed statuses"
            exit 0
          fi
          git add seo/research
          git commit -m "Record observed source statuses (G02 fetch_log)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check
          path: |
            /tmp/sources.txt
            /tmp/gates.txt
            reports/wave-all.md
