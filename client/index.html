    <!-- Fonts are self-hosted. Loading them from fonts.googleapis.com cost a
         serialised round trip to two third-party origins before text could
         paint: the CSS alone measured 415ms, and the woff2 URLs were not even
         known until it resolved. Same-origin files can be preloaded directly,
         which removes that chain from the critical path. Inter and Libre
         Baskerville are both SIL OFL licensed, so redistribution is permitted.
         Only the latin and latin-ext subsets are shipped. -->

    <link rel="preload" href="/fonts/libre-baskerville-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Critical inline styles for instant first paint -->
    <style>
      body{font-family:'Inter',system-ui,-apple-system,sans-serif;margin:0;background:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      .font-serif{font-family:'Libre Baskerville',Georgia,serif}
      #root{min-height:100vh}
      .skip-link{position:absolute;left:-9999px;top:8px;padding:8px 16px;background:#2563EB;color:#fff;border-radius:6px;z-index:9999;font-weight:600;text-decoration:none}
      .skip-link:focus{left:8px}
    </style>

    <!-- Per-page SEO tags (title, description, canonical, OG, Twitter, JSON-LD) are
