<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="Yogesh Yadav" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">

    <!-- Preload critical fonts with swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    </noscript>

    <!-- Critical inline styles for instant first paint -->
    <style>
      body{font-family:'Inter',system-ui,-apple-system,sans-serif;margin:0;background:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      .font-serif{font-family:'Libre Baskerville',Georgia,serif}
      #root{min-height:100vh}
      .skip-link{position:absolute;left:-9999px;top:8px;padding:8px 16px;background:#2563EB;color:#fff;border-radius:6px;z-index:9999;font-weight:600;text-decoration:none}
      .skip-link:focus{left:8px}
    </style>

    <!-- Per-page SEO tags (title, description, canonical, OG, Twitter, JSON-LD) are
         injected here at build time by the prerenderer from each page's <Seo> component. -->
    <!--ssr-head-->
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
